[package]
name = "silentsilo"
version = "1.3.0"
description = "SilentSilo desktop client"
authors = ["SilentSilo"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[lib]
name = "silentsilo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "silentsilo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
raw-window-handle = "0.6"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
# Reads the tab origins the browser extension sends. Already in the tree.
url = "2"
# Bitwarden's export with attachments. Already in the tree through the
# updater; deflate only, for an export zipped again by hand.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
zeroize = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
silentsilo-core = { workspace = true }
silentsilo-crypto = { workspace = true }
silentsilo-vault = { workspace = true }
silentsilo-vfs = { workspace = true }
silentsilo-shell = { workspace = true }
silentsilo-store = { workspace = true }
silentsilo-sync = { workspace = true }
silentsilo-fido = { workspace = true, features = ["hardware"] }
silentsilo-app = { workspace = true }
silentsilo-audit = { workspace = true }
# The same version russh already pulls in for SFTP, so generating SSH keys
# for credential entries, and the SSH agent's key types, cost no new crate
# in the tree: russh enables these features already.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519", "rsa", "p256", "p384", "encryption", "std"] }
# RSA keys kept as PKCS#1 or PKCS#8 PEM, for the SSH agent. The version
# ssh-key uses.
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["encoding", "std"] }
# The Signer and Verifier traits ssh-key implements, at its version.
signature = "3.0.0"
# KeePass databases, for import and export (MIT). KDBX 4 writing is behind
# its own feature.
keepass = { version = "0.15", features = ["save_kdbx4"] }
# Its timestamps; already in the tree through it.
chrono = { version = "0.4", default-features = false }
# Only for the background sync timer; Tauri already runs on this runtime.
tokio = { version = "1", features = ["macros", "sync", "time"] }

# Edge's own autofill and password manager are turned off on the WebView2
# settings interface, which has no Tauri wrapper. `windows-core` is only for
# the QueryInterface cast to `ICoreWebView2Settings4`; both crates are already
# in the tree under tauri.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

# The join tests are async: they publish a silo to a folder and join it back.
# The runtime is already in the tree under tauri, so this adds no crate.
[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# End-to-end tests of the real app: a constant in place of the security key,
# and every file under SILENTSILO_E2E_DIR. Debug builds only.
e2e = ["silentsilo-fido/test-authenticator"]
