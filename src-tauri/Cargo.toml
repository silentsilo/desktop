[package]
name = "silentsilo"
version = "1.1.0"
description = "SilentSilo desktop client"
authors = ["SilentSilo"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[lib]
name = "silentsilo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "silentsilo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
raw-window-handle = "0.6"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
tempfile = { workspace = true }
rand = { workspace = true }
silentsilo-core = { workspace = true }
silentsilo-crypto = { workspace = true }
silentsilo-vault = { workspace = true }
silentsilo-vfs = { workspace = true }
silentsilo-shell = { workspace = true }
silentsilo-store = { workspace = true }
silentsilo-sync = { workspace = true }
silentsilo-fido = { workspace = true, features = ["hardware"] }
silentsilo-app = { workspace = true }
# The same version russh already pulls in for SFTP, so generating SSH keys
# for credential entries costs no new crate in the tree.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
# Only for the background sync timer; Tauri already runs on this runtime.
tokio = { version = "1", features = ["time"] }

# Edge's own autofill and password manager are turned off on the WebView2
# settings interface, which has no Tauri wrapper. `windows-core` is only for
# the QueryInterface cast to `ICoreWebView2Settings4`; both crates are already
# in the tree under tauri.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

# The join tests are async: they publish a silo to a folder and join it back.
# The runtime is already in the tree under tauri, so this adds no crate.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
