[package]
name = "silentsilo"
version = "1.0.0"
description = "SilentSilo desktop client"
authors = ["SilentSilo"]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[lib]
name = "silentsilo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "silentsilo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
raw-window-handle = "0.6"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
tempfile = { workspace = true }
rand = { workspace = true }
silentsilo-core = { workspace = true }
silentsilo-crypto = { workspace = true }
silentsilo-vault = { workspace = true }
silentsilo-vfs = { workspace = true }
silentsilo-shell = { workspace = true }
silentsilo-store = { workspace = true }
silentsilo-sync = { workspace = true }
silentsilo-fido = { workspace = true, features = ["hardware"] }
# The same version russh already pulls in for SFTP, so generating SSH keys
# for credential entries costs no new crate in the tree.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
# Only for the background sync timer; Tauri already runs on this runtime.
tokio = { version = "1", features = ["time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
