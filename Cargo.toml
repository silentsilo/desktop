[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/silentsilo-shell",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

# The domain crates live in silentsilo/core and are pinned to a tag, never a
# branch: a release built from a moving target cannot be rebuilt later. The
# lockfile goes further and pins the commit, so a tag moved after the fact
# changes nothing here.
#
# To work on both at once, put a `[patch]` in `.cargo/config.toml` pointing at
# a local core checkout. That file is gitignored, and it rewrites Cargo.lock:
# restore the lockfile before committing. CI passes `--locked` on every cargo
# command, and the `lockfile-guard` job checks the sources directly, so a
# patched lockfile fails loudly rather than shipping.
#
# Pinned to a commit while core 1.4.0 is on its way. No release can be cut
# from this: the release workflow reads the tag from these lines, and there
# is none until they point at v1.4.0.
[workspace.dependencies]
silentsilo-core = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-crypto = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-vault = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-vfs = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-store = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-sync = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-fido = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-app = { git = "https://github.com/silentsilo/core", rev = "b5a3bb58eff2db69a4b98b17897f98168d286faa" }
silentsilo-shell = { path = "crates/silentsilo-shell" }

rand = "0.9"
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
