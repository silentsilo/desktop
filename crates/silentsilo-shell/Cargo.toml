[package]
name = "silentsilo-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The copied secret is held in memory until a lock takes it back.
zeroize = { workspace = true }
# The browser extension's pipe. Already in the tree under tauri; the app
# runs this crate's server on the same runtime.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

# Only the classes this crate touches: the pasteboard, the workspace's
# notification centre and the distributed one. AppKit's default feature set
# is every class in the framework.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDistributedNotificationCenter",
    "NSEnumerator",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
] }
