name: Release everything that is not Windows

# Runs on version tags. Builds the extraction tool for the two platforms
# that cannot be built on the release machine, and the macOS and Linux
# applications. Everything Windows in a release (the installer, its updater
# signature, latest.json and the Windows extractor) is built by
# scripts\build-release-local.ps1 and uploaded by hand.
#
# The Windows app is not built here on purpose. Its Authenticode certificate
# lives on a hardware token that no runner can reach, so a CI build would
# produce an unsigned installer under exactly the file names the signed one
# uses, plus a latest.json whose minisign signature covers the unsigned
# bytes. Publishing that manifest offers an update the app then refuses to
# install, and nothing announces the mistake until someone tries to update.
#
# The macOS app is built here unsigned, as a check that it builds, and kept
# as a workflow artifact only. The release is built, signed and notarised on
# the Mac by scripts/build-release-mac.sh.
#
# The extractor's source lives in silentsilo/core. It is built here from a
# clean clone of the core tag this app pins, checked against the commit the
# lockfile records, so the binary on the release page comes from exactly the
# revision the installer was compiled against. Same logic as the local script
# uses for the Windows one.
#
# No signing key is on GitHub. The build jobs never see a token that can
# write: they run vite, every npm install script, every cargo build script
# and the bundler, and any of those can plant something for a later step of
# the same job (a changed node_modules, a line in $GITHUB_ENV). So they only
# build and upload workflow artifacts, and `publish` attaches them unsigned,
# with provenance, building nothing. The release machine checks that
# provenance and signs every file for the updater.
on:
  push:
    tags:
      - "v*"
  # Run by hand, from any branch, to find out whether a build works before a
  # tag exists. Nothing is attached to a release in that mode and no release
  # is created: the output stays a workflow artifact, which is exactly what
  # is wanted when the question is "does this even build". The extractors and
  # the macOS app skip it, because they are answers to a tag rather than
  # experiments.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The extraction tool is the answer to "what if the project disappears", so
  # shipping it only inside the Windows installer would put it exactly where
  # it is least useful: someone recovering on Linux would have to install a
  # Windows application first. It is a plain binary with no interface and no
  # security key, so one source builds everywhere.
  build-extract:
    # A tag, never a manual run: the extractor answers a tag, and a manual run
    # asks whether the app builds.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      # One platform failing must not withhold the binary that did build: the
      # release is a draft either way, and a missing macOS binary is something
      # to notice rather than a reason to have no Linux one.
      fail-fast: false
      # Linux is built apart, in `build-extract-linux`: the runner's own glibc
      # is newer than the distributions people recover on.
      matrix:
        include:
          - os: macos-latest
            asset: silentsilo-extract-macos-aarch64
            built: silentsilo-extract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The pin is the single source of truth for which core revision the app
      # was compiled against. Read from the manifest and the lockfile rather
      # than typed here, and the two must agree with each other and with what
      # the clone below actually checks out.
      - name: Which core revision this build is pinned to
        id: pin
        shell: bash
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          commit=$(awk '/^name = "silentsilo-core"$/{f=1} f && /^source = /{print; exit}' Cargo.lock \
                   | grep -oE '#[0-9a-f]{40}' | tr -d '#')
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Cargo.toml pins no core tag, or Cargo.lock records no commit for it"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "core $tag at $commit"

      # A tag can be moved after the fact; the lockfile's commit cannot. If
      # the two disagree, the extractor about to be built is not the code the
      # installer contains.
      - name: Clone core at that tag and check the commit
        shell: bash
        run: |
          git clone --quiet --branch "${{ steps.pin.outputs.tag }}" --depth 1 \
            https://github.com/silentsilo/core core-src
          got=$(git -C core-src rev-parse HEAD)
          if [ "$got" != "${{ steps.pin.outputs.commit }}" ]; then
            echo "::error::core ${{ steps.pin.outputs.tag }} is at $got, but Cargo.lock pins ${{ steps.pin.outputs.commit }}"
            exit 1
          fi

      # No build cache in any release job: a cache is written by other runs,
      # and what it restores ends up in a binary people download.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1

      # The keychain crate reaches for D-Bus on Linux, because the vault
      # stores credentials in the OS keychain and the persistent Linux
      # backend is secret-service. The extractor never calls that code, but
      # it links the crate, so the build needs the headers.
      #
      # This is a workaround rather than the answer. A recovery binary that
      # links libdbus needs libdbus present on the machine someone is
      # recovering on, which is the one place to assume nothing. Making the
      # keychain optional in silentsilo-vault is the real fix.
      # `-p` and nothing else: this must not drag in the security key backend,
      # which is the whole reason it builds on three platforms from one
      # source. `--locked` against core's own lockfile: the extractor ships
      # with the dependency versions core tested, not whatever resolves today.
      - run: cargo test -p silentsilo-extract --release --locked
        working-directory: core-src
      - run: cargo build -p silentsilo-extract --release --locked
        working-directory: core-src

      - name: Name the binary for the platform it runs on
        shell: bash
        run: |
          mkdir -p dist
          cp "core-src/target/release/${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  # The Linux extractor, in Ubuntu 22.04 like the Linux app: a binary built on
  # the runner asked for glibc 2.38 and did not start on Ubuntu 22.04 or
  # Debian 12, which is where someone recovering a silo may well be.
  build-extract-linux:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    env:
      ASSET: silentsilo-extract-linux-x86_64
    steps:
      # The keychain crate reaches for D-Bus on Linux, because the vault
      # stores credentials in the OS keychain and the persistent Linux
      # backend is secret-service. The extractor never calls that code, but
      # it links the crate, so the build needs the headers. Making the
      # keychain optional in silentsilo-vault is the real fix.
      - name: What the bare image does not have
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config perl \
            libdbus-1-dev binutils

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Which core revision this build is pinned to
        id: pin
        shell: bash
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          commit=$(awk '/^name = "silentsilo-core"$/{f=1} f && /^source = /{print; exit}' Cargo.lock \
                   | grep -oE '#[0-9a-f]{40}' | tr -d '#')
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Cargo.toml pins no core tag, or Cargo.lock records no commit for it"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "core $tag at $commit"

      - name: Clone core at that tag and check the commit
        shell: bash
        run: |
          git clone --quiet --branch "${{ steps.pin.outputs.tag }}" --depth 1 \
            https://github.com/silentsilo/core core-src
          got=$(git -C core-src rev-parse HEAD)
          if [ "$got" != "${{ steps.pin.outputs.commit }}" ]; then
            echo "::error::core ${{ steps.pin.outputs.tag }} is at $got, but Cargo.lock pins ${{ steps.pin.outputs.commit }}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1

      - run: cargo test -p silentsilo-extract --release --locked
        working-directory: core-src
      - run: cargo build -p silentsilo-extract --release --locked
        working-directory: core-src

      # Said here rather than found on someone's machine: the newest glibc
      # symbol the binary asks for has to be one Ubuntu 22.04 has.
      - name: The binary runs on glibc 2.35
        shell: bash
        run: |
          newest=$(objdump -T core-src/target/release/silentsilo-extract \
                   | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::the extractor needs $newest, newer than Ubuntu 22.04's 2.35"
            exit 1
          fi

      - name: Name the binary for the platform it runs on
        shell: bash
        run: |
          mkdir -p dist
          cp core-src/target/release/silentsilo-extract "dist/$ASSET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: silentsilo-extract-linux-x86_64
          path: dist/silentsilo-extract-linux-x86_64
          retention-days: 7

  # The macOS application: a universal binary (Apple silicon and Intel) in a
  # .app inside a .dmg, plus the .app.tar.gz the updater downloads. Built
  # against the core commit the lockfile pins, like everything else, through
  # `--locked`.
  #
  # Built here unsigned and never shipped from here: the answer to "does it
  # build". The release is built, signed and notarised on the Mac
  # (scripts/build-release-mac.sh), where the Developer ID certificate lives;
  # no Apple secret is on GitHub.
  build-macos-app:
    runs-on: macos-latest
    # Two cold cargo release builds, one per architecture.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci

      # The browser extension's host, as on Windows and Linux: shipped once a
      # store lists the extension, checked with `--check-release`, built for
      # both architectures and joined into one binary for the universal app.
      # The bundler puts it in Contents/MacOS beside the app; the app copies
      # it out at runtime (browser_pipe.rs says why).
      - name: The browser host, when a store lists the extension
        id: host
        shell: bash
        run: |
          set -euo pipefail
          listed=$(jq '[.chrome_web_store, .edge_add_ons, .firefox_add_ons] | map(. // []) | add | length' \
                   crates/silentsilo-browser-host/allowed-origins.json)
          if [ "$listed" -eq 0 ]; then
            echo "no store lists the extension: built without the host"
            echo "config=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p silentsilo-browser-host --release --locked --target "$arch"
          done
          mkdir -p src-tauri/binaries
          # A universal build compiles each architecture on its own first,
          # and each looks for its own copy.
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "target/$arch/release/silentsilo-browser-host" "src-tauri/binaries/silentsilo-browser-host-$arch"
          done
          lipo -create -output src-tauri/binaries/silentsilo-browser-host-universal-apple-darwin \
            target/aarch64-apple-darwin/release/silentsilo-browser-host \
            target/x86_64-apple-darwin/release/silentsilo-browser-host
          src-tauri/binaries/silentsilo-browser-host-universal-apple-darwin --check-release
          echo "config=--config src-tauri/tauri.browser-host.json" >> "$GITHUB_OUTPUT"

      # The .app only: the .dmg is made after signing, around the signed app,
      # and the updater archive after notarisation.
      - name: Build, unsigned
        env:
          SILENTSILO_GOOGLE_CLIENT_SECRET: ${{ secrets.SILENTSILO_GOOGLE_CLIENT_SECRET }}
        run: npx tauri build --ci --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ steps.host.outputs.config }} -- --locked

      # A tar, because an artifact is a zip and a zip loses the symlinks and
      # the permissions an .app depends on.
      - name: Pack the app
        shell: bash
        env:
          COPYFILE_DISABLE: 1
        run: |
          out=target/universal-apple-darwin/release/bundle/macos
          app=$(cd "$out" && ls -d *.app)
          mkdir -p dist-macos
          tar -C "$out" -cf dist-macos/unsigned-app.tar "$app"
          ls -l dist-macos

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-app-unsigned
          path: dist-macos/unsigned-app.tar
          retention-days: 7

  # The Linux application: a .deb for the Debian and Ubuntu family, and an
  # AppImage for everything else. No certificate and no signing secret.
  #
  # Built inside an Ubuntu 22.04 container rather than on the runner image.
  # The distribution you compile on fixes the minimum glibc, and 22.04 means
  # 2.35, which covers Debian 12, Ubuntu 22.04 and newer, Fedora 36 and
  # newer. On `ubuntu-latest` that floor would rise the day GitHub changes
  # the image, and nobody would find out until someone could not start the
  # app.
  #
  # For latest.json, the keys are `linux-x86_64-deb` and
  # `linux-x86_64-appimage`, pointing at the .deb and the .AppImage
  # themselves. The updater looks for `{os}-{arch}-{format}`
  # first and only then for `{os}-{arch}`, so a bare `linux-x86_64` would
  # hand one of the two formats a file it cannot install. Write both, never
  # the bare one.
  build-linux-app:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      # The image is bare, so this comes before the checkout, which wants
      # git, and before every action, which wants curl and certificates.
      #
      # The last line is the AppImage tooling's own needs, and it is there
      # because the first run failed on it: linuxdeploy copies `xdg-open`
      # into the image, its gtk plugin copies the pixbuf loaders, and
      # `patchelf` and `mksquashfs` are what actually assemble the result.
      # None of that is a build dependency of the app, which is why none of
      # it appears in the CI job that only compiles.
      - name: What the bare image does not have
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git xz-utils \
            build-essential pkg-config desktop-file-utils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev libudev-dev libssl-dev \
            xdg-utils patchelf squashfs-tools libgdk-pixbuf-2.0-dev jq

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - run: npm ci

      # `APPIMAGE_EXTRACT_AND_RUN` because the AppImage tooling mounts itself
      # through FUSE by default, and a container has no FUSE. Without it the
      # AppImage step fails and the deb beside it never gets built.
      #
      # No updater key here. `tauri build` runs vite, every npm plugin, every
      # cargo build script and the bundler, and the key was in the
      # environment of all of them: one compromised dependency anywhere in
      # that tree could read the key that signs updates for every install.
      # `createUpdaterArtifacts: false` is what lets it out, since the
      # bundler refuses to make an updater artifact it cannot sign.
      # The browser extension's host, as on Windows: shipped once any store
      # lists the extension, and only after `--check-release` passes on the
      # binary that ships. Tauri installs it beside the app (`/usr/bin` in the
      # .deb), where the app's channel looks for it.
      - name: The browser host, when a store lists the extension
        id: host
        shell: bash
        run: |
          set -euo pipefail
          listed=$(jq '[.chrome_web_store, .edge_add_ons, .firefox_add_ons] | map(. // []) | add | length'                    crates/silentsilo-browser-host/allowed-origins.json)
          if [ "$listed" -eq 0 ]; then
            echo "no store lists the extension: built without the host"
            echo "config=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo build -p silentsilo-browser-host --release --locked
          target/release/silentsilo-browser-host --check-release
          mkdir -p src-tauri/binaries
          cp target/release/silentsilo-browser-host              src-tauri/binaries/silentsilo-browser-host-x86_64-unknown-linux-gnu
          echo "config=--config src-tauri/tauri.browser-host.json" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Compiled into core's Google Drive sign-in; unset leaves it out.
          SILENTSILO_GOOGLE_CLIENT_SECRET: ${{ secrets.SILENTSILO_GOOGLE_CLIENT_SECRET }}
        run: npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ steps.host.outputs.config }} -- --locked

      # The tree is listed before anything is copied out of it, so a missing
      # file is a readable log line rather than a glob that matched nothing.
      #
      # Linux has no updater archive: unlike macOS, where the updater
      # downloads a .app.tar.gz, here it downloads the .deb or the .AppImage
      # itself. The build above makes neither signature; `publish` does.
      - name: Collect the bundle
        shell: bash
        run: |
          out=target/release/bundle
          echo "== what the bundler produced"
          find "$out" -maxdepth 2 -type f | sort
          mkdir -p dist-linux
          cp "$out"/deb/*.deb dist-linux/
          cp "$out"/appimage/*.AppImage dist-linux/
          ls -l dist-linux

      # The AppImage carries libwayland-* from this Ubuntu 22.04 image, and
      # on a newer Mesa (Fedora 44 here) WebKit then aborts at start with
      # "Could not create default EGL display: EGL_BAD_PARAMETER". Every
      # desktop that runs Wayland already has those libraries, so they go
      # and the system's are used. Tested on Ubuntu 22.04, Debian 12 and
      # Fedora 44. The runtime is the one the bundler used, cut from the
      # front of its own image; only appimagetool is fetched, pinned.
      - name: Drop the bundled Wayland libraries from the AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          img=$(realpath dist-linux/*.AppImage)
          work=$(mktemp -d)
          cd "$work"
          cp "$img" orig.AppImage
          chmod +x orig.AppImage
          offset=$(./orig.AppImage --appimage-offset)
          head -c "$offset" orig.AppImage > runtime
          ./orig.AppImage --appimage-extract > /dev/null
          echo "== removing"
          ls squashfs-root/usr/lib/libwayland-*
          rm squashfs-root/usr/lib/libwayland-*
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --no-appstream --runtime-file runtime squashfs-root repacked.AppImage
          cp repacked.AppImage "$img"
          ls -l "$img"

      # Kept whatever the trigger was, and what `publish` signs. On a manual
      # run this is the whole point.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-app
          path: dist-linux/
          retention-days: 7

  # What the release is made of: every crate in Cargo.lock and every package
  # in package-lock.json, as CycloneDX. Its own job, with no secret and no
  # write token: the action downloads its scanner when it runs.
  sbom:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: silentsilo-desktop-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: silentsilo-desktop-${{ github.ref_name }}.cdx.json
          retention-days: 7

  # Attaches what the jobs above built to the draft. No updater key here or
  # anywhere on GitHub: every updater signature is made on the release
  # machine (scripts\build-release-local.ps1), after it has checked these
  # files' provenance. So a tag pushed by someone who should not have, or a
  # dependency of this workflow, can at most attach unsigned files to a
  # draft, which no installed app accepts as an update.
  #
  # `!cancelled()` because one platform failing must not withhold what did
  # build: the release is a draft either way. Tags only.
  publish:
    needs: [build-extract, build-extract-linux, build-linux-app, sbom]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Build provenance: a signed statement, in GitHub's attestation store,
      # that these files came out of this workflow run. The release machine
      # checks it before it signs anything.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Which core revision this build is pinned to
        id: pin
        shell: bash
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          commit=$(awk '/^name = "silentsilo-core"$/{f=1} f && /^source = /{print; exit}' Cargo.lock \
                   | grep -oE '#[0-9a-f]{40}' | tr -d '#')
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Cargo.toml pins no core tag, or Cargo.lock records no commit for it"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "core $tag at $commit"

      # Each by its name: a job of this workflow can upload an artifact of
      # any name, and a pattern would take in whatever turned up.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsilo-extract-macos-aarch64
          path: artifacts/extract-macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsilo-extract-linux-x86_64
          path: artifacts/extract-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.SHIP_LINUX == 'true'
        with:
          name: linux-app
          path: artifacts/linux-app
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: artifacts/sbom

      # What goes on the draft, and nothing else: each file named, and
      # anything unexpected beside them stops the job.
      - name: Choose what ships
        shell: bash
        env:
          SHIP_LINUX: ${{ vars.SHIP_LINUX }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ship
          expect() {
            local dir=$1 pattern=$2
            local found
            found=$(find "$dir" -maxdepth 1 -type f -name "$pattern")
            if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
              echo "::error::expected exactly one $pattern in $dir"
              exit 1
            fi
            cp "$found" ship/
          }
          only() {
            local dir=$1 count=$2
            local have
            have=$(find "$dir" -type f | wc -l)
            if [ "$have" -ne "$count" ]; then
              echo "::error::$dir holds $have files, $count expected:"
              find "$dir" -type f
              exit 1
            fi
          }
          only artifacts/extract-macos 1
          expect artifacts/extract-macos silentsilo-extract-macos-aarch64
          only artifacts/extract-linux 1
          expect artifacts/extract-linux silentsilo-extract-linux-x86_64
          only artifacts/sbom 1
          expect artifacts/sbom "silentsilo-desktop-$TAG.cdx.json"
          if [ "$SHIP_LINUX" = "true" ]; then
            only artifacts/linux-app 2
            expect artifacts/linux-app "*_amd64.deb"
            expect artifacts/linux-app "*_amd64.AppImage"
          fi
          ls -l ship

      # Provenance for what this run built: the extractors, the Linux app and
      # the SBOM. The release machine verifies it with
      # `gh attestation verify --cert-identity` before signing these for the
      # updater; anyone can check it the same way.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ship/*

      # `draft: true` is applied to an existing release too, so attaching to
      # a tag that has already been published would flip it back to draft and
      # 404 every asset URL, latest.json's installer included. A re-run is
      # exactly when that happens, so it is checked rather than assumed.
      - name: Refuse to attach to a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never pasted into the script.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          state=$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft 2>/dev/null || echo absent)
          if [ "$state" = "false" ]; then
            echo "::error::$TAG is already published. Attaching here would put it back in draft and break every download. Upload the files by hand instead."
            exit 1
          fi
          echo "release is $state, safe to attach"

      # Releases are titled "SilentSilo 1.2.1", not by their tag.
      - name: Release title
        id: title
        run: echo "name=SilentSilo ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Attach to the draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.title.outputs.name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: "Built against silentsilo/core ${{ steps.pin.outputs.tag }} (${{ steps.pin.outputs.commit }})."
          files: ship/*
