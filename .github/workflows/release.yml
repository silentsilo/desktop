name: Release

# Runs on version tags. It opens the draft release and fills it with the
# extraction tools for Linux and macOS, taken from the silentsilo/core
# release this build is pinned to.
#
# The app is not built here on purpose. Its Authenticode certificate lives on
# a hardware token that no runner can reach, so a CI build would produce an
# unsigned installer under exactly the file names the signed one uses, plus a
# latest.json whose minisign signature covers the unsigned bytes. Publishing
# that manifest offers an update the app then refuses to install, and nothing
# announces the mistake until someone tries to update. The installer, its
# updater signature, latest.json and the Windows extractor come from
# scripts\build-release-local.ps1 and are uploaded by hand.
#
# The Linux and macOS extractors are not rebuilt here either. They were built
# and signed by silentsilo/core when its tag was pushed, from exactly the
# revision this release is compiled against, so rebuilding them would produce
# a second binary claiming to be the same thing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The tag this build is pinned to, read from the manifest rather than
      # passed in: the pin is the single source of truth for which core
      # revision the app was compiled against, and a hand-typed tag here
      # could name a different one.
      - name: Which core release this build is pinned to
        id: pin
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          if [ -z "$tag" ]; then
            echo "::error::no core tag pinned in Cargo.toml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned to core $tag"

      # The extraction tool is the answer to "what if the project
      # disappears", so shipping it only inside the Windows installer would
      # put it exactly where it is least useful: someone recovering on Linux
      # would have to install a Windows application first.
      - name: Fetch the extractors from the pinned core release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.pin.outputs.tag }}" \
            --repo silentsilo/core \
            --pattern 'silentsilo-extract-*' \
            --dir dist
          ls -l dist

      # A release page missing half its recovery tools is worth failing for.
      # The Windows extractor is not checked here: it comes off the release
      # machine with the installer.
      - name: Refuse a half-filled release
        run: |
          missing=0
          for f in silentsilo-extract-linux-x86_64 \
                   silentsilo-extract-linux-x86_64.sig \
                   silentsilo-extract-macos-aarch64 \
                   silentsilo-extract-macos-aarch64.sig; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::$f is missing from core ${{ steps.pin.outputs.tag }}"
              missing=1
            fi
          done
          exit $missing

      - name: Open the draft and attach them
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
