name: Release everything that is not Windows

# Runs on version tags. Builds the extraction tool for the two platforms
# that cannot be built on the release machine, and the macOS and Linux
# applications. Everything Windows in a release (the installer, its updater
# signature, latest.json and the Windows extractor) is built by
# scripts\build-release-local.ps1 and uploaded by hand.
#
# The Windows app is not built here on purpose. Its Authenticode certificate
# lives on a hardware token that no runner can reach, so a CI build would
# produce an unsigned installer under exactly the file names the signed one
# uses, plus a latest.json whose minisign signature covers the unsigned
# bytes. Publishing that manifest offers an update the app then refuses to
# install, and nothing announces the mistake until someone tries to update.
#
# The macOS app has no such constraint: Developer ID signing takes a
# certificate in a secret, and notarisation is a network call. Until those
# secrets exist the job still runs, so the build itself is exercised, but
# its unsigned output is kept as a workflow artifact and never attached to
# the release. See the job for the rule.
#
# The extractor's source lives in silentsilo/core. It is built here from a
# clean clone of the core tag this app pins, checked against the commit the
# lockfile records, so the binary on the release page comes from exactly the
# revision the installer was compiled against. Same logic as the local script
# uses for the Windows one.
#
# The build jobs never see the updater key or a token that can write. They run
# vite, every npm install script, every cargo build script and the bundler,
# and any of those can plant something for a later step of the same job (a
# changed node_modules, a line in $GITHUB_ENV). So they only build and upload
# workflow artifacts. The `publish` job signs and attaches, from a fresh
# checkout, with `npm ci --ignore-scripts` and no build cache.
on:
  push:
    tags:
      - "v*"
  # Run by hand, from any branch, to find out whether a build works before a
  # tag exists. Nothing is attached to a release in that mode and no release
  # is created: the output stays a workflow artifact, which is exactly what
  # is wanted when the question is "does this even build". The extractors and
  # the macOS app skip it, because they are answers to a tag rather than
  # experiments.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The extraction tool is the answer to "what if the project disappears", so
  # shipping it only inside the Windows installer would put it exactly where
  # it is least useful: someone recovering on Linux would have to install a
  # Windows application first. It is a plain binary with no interface and no
  # security key, so one source builds everywhere.
  build-extract:
    # A tag, never a manual run: the extractor answers a tag, and a manual run
    # asks whether the app builds.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      # One platform failing must not withhold the binary that did build: the
      # release is a draft either way, and a missing macOS binary is something
      # to notice rather than a reason to have no Linux one.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: silentsilo-extract-linux-x86_64
            built: silentsilo-extract
          - os: macos-latest
            asset: silentsilo-extract-macos-aarch64
            built: silentsilo-extract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The pin is the single source of truth for which core revision the app
      # was compiled against. Read from the manifest and the lockfile rather
      # than typed here, and the two must agree with each other and with what
      # the clone below actually checks out.
      - name: Which core revision this build is pinned to
        id: pin
        shell: bash
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          commit=$(awk '/^name = "silentsilo-core"$/{f=1} f && /^source = /{print; exit}' Cargo.lock \
                   | grep -oE '#[0-9a-f]{40}' | tr -d '#')
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Cargo.toml pins no core tag, or Cargo.lock records no commit for it"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "core $tag at $commit"

      # A tag can be moved after the fact; the lockfile's commit cannot. If
      # the two disagree, the extractor about to be built is not the code the
      # installer contains.
      - name: Clone core at that tag and check the commit
        shell: bash
        run: |
          git clone --quiet --branch "${{ steps.pin.outputs.tag }}" --depth 1 \
            https://github.com/silentsilo/core core-src
          got=$(git -C core-src rev-parse HEAD)
          if [ "$got" != "${{ steps.pin.outputs.commit }}" ]; then
            echo "::error::core ${{ steps.pin.outputs.tag }} is at $got, but Cargo.lock pins ${{ steps.pin.outputs.commit }}"
            exit 1
          fi

      # No build cache in any release job: a cache is written by other runs,
      # and what it restores ends up in a binary people download.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1

      # The keychain crate reaches for D-Bus on Linux, because the vault
      # stores credentials in the OS keychain and the persistent Linux
      # backend is secret-service. The extractor never calls that code, but
      # it links the crate, so the build needs the headers.
      #
      # This is a workaround rather than the answer. A recovery binary that
      # links libdbus needs libdbus present on the machine someone is
      # recovering on, which is the one place to assume nothing. Making the
      # keychain optional in silentsilo-vault is the real fix.
      - name: D-Bus headers, for the keychain crate the extractor does not use
        if: matrix.os == 'ubuntu-latest'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && break
            echo "apt-get update stalled or failed (attempt $attempt)"
            sudo pkill -9 -f apt-get || true
            sudo dpkg --configure -a || true
            sleep 5
          done
          sudo apt-get install -y libdbus-1-dev pkg-config

      # `-p` and nothing else: this must not drag in the security key backend,
      # which is the whole reason it builds on three platforms from one
      # source. `--locked` against core's own lockfile: the extractor ships
      # with the dependency versions core tested, not whatever resolves today.
      - run: cargo test -p silentsilo-extract --release --locked
        working-directory: core-src
      - run: cargo build -p silentsilo-extract --release --locked
        working-directory: core-src

      - name: Name the binary for the platform it runs on
        shell: bash
        run: |
          mkdir -p dist
          cp "core-src/target/release/${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  # The macOS application: a universal binary (Apple silicon and Intel) in a
  # .app inside a .dmg, plus the .app.tar.gz the updater downloads, signed
  # by `publish`. Built against the core commit the lockfile pins, like
  # everything else, through `--locked`.
  #
  # Signing and notarisation happen inside `tauri build` when the APPLE_*
  # variables are set, and are skipped when they are not. The rule that
  # decides whether the output reaches the release is Gatekeeper: an app
  # that is not both signed and notarised is refused on every Mac that did
  # not build it, and an updater manifest pointing at one would offer an
  # update nobody can install. So a build without a Developer ID is kept as
  # a workflow artifact, for looking at, and only a build this job has
  # verified as signed and notarised is attached to the draft by `publish`.
  #
  # The macOS entries of latest.json are not written yet. When they are, the
  # trap to know: the updater asks for `darwin-aarch64` and `darwin-x86_64`
  # and never for `darwin-universal`, so a universal build needs both keys
  # pointing at the same archive.
  build-macos-app:
    # Manual runs reach here too, so that "does it build" can be answered
    # without a tag.
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.apple.outputs.signed }}
    # Two cold cargo release builds, one per architecture, plus notarisation,
    # which is a queue on Apple's side and not a local step.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci

      # Secrets are not readable in `if:`, so the decision is made once here
      # and read as a step output below. All six or none: a half-configured
      # set is the dangerous case, because the bundler signs with what it has
      # and then skips notarisation with a warning rather than an error,
      # which yields an app Gatekeeper refuses under a name that says it was
      # signed.
      - name: Which Apple secrets are configured
        id: apple
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          have=0
          missing=""
          for name in $names; do
            if [ -n "${!name}" ]; then
              have=$((have + 1))
            else
              missing="$missing $name"
            fi
          done
          if [ "$have" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple secrets: the build will be unsigned and kept as an artifact only"
          elif [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID present: the build will be signed and notarised"
          else
            echo "::error::Apple secrets are half configured. Missing:$missing. Set all six or none."
            exit 1
          fi

      # Two build steps rather than one with empty variables: the bundler
      # treats a set-but-empty APPLE_CERTIFICATE as a certificate to import,
      # and fails on it.
      #
      # Neither carries the updater key. `tauri build` runs vite, every npm
      # plugin, every cargo build script and the bundler, and the key was in
      # the environment of all of them: one compromised dependency anywhere
      # in that tree could read the key that signs updates for every install.
      # `createUpdaterArtifacts: false` is what lets it out, since the
      # bundler refuses to make an updater artifact it cannot sign, so the
      # .app.tar.gz is made below and signed by `publish`. The
      # Apple secrets stay here: codesigning and notarisation happen inside
      # `tauri build` and there is no separate step to move them to.
      - name: Build, unsigned
        if: steps.apple.outputs.signed == 'false'
        run: npx tauri build --ci --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      - name: Build, sign and notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --ci --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # The archive the macOS updater downloads, which the bundler would
      # otherwise have made: a gzipped tar of the .app, taken from the
      # directory holding it so the .app is at the root of the archive.
      #
      # After notarisation, never before: the ticket is stapled into the
      # .app, and an archive made first would carry an app Gatekeeper asks
      # Apple about. `COPYFILE_DISABLE` because bsdtar otherwise writes an
      # AppleDouble `._` file beside every entry, which unpacks into the
      # installed app as litter nobody put there.
      - name: Archive the app for the updater
        shell: bash
        env:
          COPYFILE_DISABLE: 1
        run: |
          out=target/universal-apple-darwin/release/bundle/macos
          app=$(cd "$out" && ls -d *.app)
          tar -C "$out" -czf "$out/$app.tar.gz" "$app"
          ls -l "$out"

      # The workspace root is the repository root, so cargo and the bundler
      # write to target\, not to src-tauri\target\. The staging directory is
      # not `dist`: that is the frontend's build output, which `tauri build`
      # has just refilled through beforeBuildCommand, and mixing the two
      # would put index.html on the release page.
      - name: Collect the bundle
        shell: bash
        run: |
          out=target/universal-apple-darwin/release/bundle
          mkdir -p dist-macos
          cp "$out"/dmg/*.dmg dist-macos/
          cp "$out"/macos/*.app.tar.gz dist-macos/
          ls -l dist-macos

      # What the gate above promised, checked against the artifact rather
      # than against the presence of a secret. `spctl` answers the question
      # a user's Mac will ask, and `stapler` proves the notarisation ticket
      # travels with the app instead of needing Apple to be reachable.
      - name: Prove it is signed and notarised
        if: steps.apple.outputs.signed == 'true'
        shell: bash
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          echo "== $app"
          codesign --verify --strict --verbose=2 "$app"
          spctl --assess --type exec --verbose=4 "$app"
          xcrun stapler validate "$app"

      # Signed or not, it goes to `publish` as an artifact; only a build the
      # step above proved signed and notarised is attached there.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-app
          path: dist-macos/
          retention-days: 7

  # The Linux application: a .deb for the Debian and Ubuntu family, and an
  # AppImage for everything else. No certificate and no secrets beyond the
  # updater key, so unlike macOS there is nothing to gate on.
  #
  # Built inside an Ubuntu 22.04 container rather than on the runner image.
  # The distribution you compile on fixes the minimum glibc, and 22.04 means
  # 2.35, which covers Debian 12, Ubuntu 22.04 and newer, Fedora 36 and
  # newer. On `ubuntu-latest` that floor would rise the day GitHub changes
  # the image, and nobody would find out until someone could not start the
  # app.
  #
  # For latest.json, the keys are `linux-x86_64-deb` and
  # `linux-x86_64-appimage`, pointing at the .deb and the .AppImage
  # themselves. The updater looks for `{os}-{arch}-{format}`
  # first and only then for `{os}-{arch}`, so a bare `linux-x86_64` would
  # hand one of the two formats a file it cannot install. Write both, never
  # the bare one.
  build-linux-app:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      # The image is bare, so this comes before the checkout, which wants
      # git, and before every action, which wants curl and certificates.
      #
      # The last line is the AppImage tooling's own needs, and it is there
      # because the first run failed on it: linuxdeploy copies `xdg-open`
      # into the image, its gtk plugin copies the pixbuf loaders, and
      # `patchelf` and `mksquashfs` are what actually assemble the result.
      # None of that is a build dependency of the app, which is why none of
      # it appears in the CI job that only compiles.
      - name: What the bare image does not have
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git xz-utils \
            build-essential pkg-config desktop-file-utils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev libudev-dev libssl-dev \
            xdg-utils patchelf squashfs-tools libgdk-pixbuf-2.0-dev

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - run: npm ci

      # `APPIMAGE_EXTRACT_AND_RUN` because the AppImage tooling mounts itself
      # through FUSE by default, and a container has no FUSE. Without it the
      # AppImage step fails and the deb beside it never gets built.
      #
      # No updater key here. `tauri build` runs vite, every npm plugin, every
      # cargo build script and the bundler, and the key was in the
      # environment of all of them: one compromised dependency anywhere in
      # that tree could read the key that signs updates for every install.
      # `createUpdaterArtifacts: false` is what lets it out, since the
      # bundler refuses to make an updater artifact it cannot sign.
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # The tree is listed before anything is copied out of it, so a missing
      # file is a readable log line rather than a glob that matched nothing.
      #
      # Linux has no updater archive: unlike macOS, where the updater
      # downloads a .app.tar.gz, here it downloads the .deb or the .AppImage
      # itself. The build above makes neither signature; `publish` does.
      - name: Collect the bundle
        shell: bash
        run: |
          out=target/release/bundle
          echo "== what the bundler produced"
          find "$out" -maxdepth 2 -type f | sort
          mkdir -p dist-linux
          cp "$out"/deb/*.deb dist-linux/
          cp "$out"/appimage/*.AppImage dist-linux/
          ls -l dist-linux

      # Kept whatever the trigger was, and what `publish` signs. On a manual
      # run this is the whole point.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-app
          path: dist-linux/
          retention-days: 7

  # The one job that sees the updater key and a token that can write. It
  # builds nothing: a fresh checkout for the lockfile and the pin, the signer
  # from `npm ci --ignore-scripts`, and the artifacts the jobs above left.
  #
  # `!cancelled()` because one platform failing must not withhold what did
  # build: the release is a draft either way. A manual run signs too, so the
  # path is exercised before a tag, and attaches nothing.
  publish:
    needs: [build-extract, build-macos-app, build-linux-app]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Which core revision this build is pinned to
        id: pin
        shell: bash
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          commit=$(awk '/^name = "silentsilo-core"$/{f=1} f && /^source = /{print; exit}' Cargo.lock \
                   | grep -oE '#[0-9a-f]{40}' | tr -d '#')
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Cargo.toml pins no core tag, or Cargo.lock records no commit for it"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "core $tag at $commit"

      # The signer as the lockfile pins it, and nothing run while installing.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # What goes on the draft, and nothing else. Extractors always; macOS
      # only when its job proved the build signed and notarised; Linux only
      # once SHIP_LINUX is "true", since the platforms debut together.
      - name: Choose what ships
        shell: bash
        env:
          MAC_SIGNED: ${{ needs.build-macos-app.outputs.signed }}
          SHIP_LINUX: ${{ vars.SHIP_LINUX }}
        run: |
          mkdir -p ship
          for f in artifacts/silentsilo-extract-*/silentsilo-extract-*; do
            if [ -f "$f" ]; then cp "$f" ship/; fi
          done
          if [ "$MAC_SIGNED" = "true" ]; then
            cp artifacts/macos-app/*.dmg artifacts/macos-app/*.app.tar.gz ship/
          fi
          if [ "$SHIP_LINUX" = "true" ]; then
            cp artifacts/linux-app/*.deb artifacts/linux-app/*.AppImage ship/
          fi
          ls -l ship

      # Everything the updater might download gets a signature, and the
      # extractors too: "is this the binary the project published" has to be
      # answerable without trusting GitHub. Verify with minisign against the
      # public key in tauri.conf.json, also SIGNING-PUBKEY.txt in core. The
      # .dmg is installed by hand and is not signed here.
      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in ship/*; do
            case "$file" in *.dmg|*.sig) continue ;; esac
            npx --no-install tauri signer sign "$file"
            [ -f "$file.sig" ] || { echo "::error::no signature for $file"; exit 1; }
          done
          ls -l ship

      # `draft: true` is applied to an existing release too, so attaching to
      # a tag that has already been published would flip it back to draft and
      # 404 every asset URL, latest.json's installer included. A re-run is
      # exactly when that happens, so it is checked rather than assumed.
      - name: Refuse to attach to a published release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || echo absent)
          if [ "$state" = "false" ]; then
            echo "::error::${{ github.ref_name }} is already published. Attaching here would put it back in draft and break every download. Upload the files by hand instead."
            exit 1
          fi
          echo "release is $state, safe to attach"

      - name: Attach to the draft
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: "Built against silentsilo/core ${{ steps.pin.outputs.tag }} (${{ steps.pin.outputs.commit }})."
          files: ship/*

      - name: Keep the signed files of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed
          path: ship/
          retention-days: 7
