name: Release extractors and macOS app

# Runs on version tags. Builds the extraction tool for the two platforms
# that cannot be built on the release machine, and the macOS app. Everything
# else in a release (the Windows installer, its updater signature,
# latest.json and the Windows extractor) is built by
# scripts\build-release-local.ps1 and uploaded by hand.
#
# The Windows app is not built here on purpose. Its Authenticode certificate
# lives on a hardware token that no runner can reach, so a CI build would
# produce an unsigned installer under exactly the file names the signed one
# uses, plus a latest.json whose minisign signature covers the unsigned
# bytes. Publishing that manifest offers an update the app then refuses to
# install, and nothing announces the mistake until someone tries to update.
#
# The macOS app has no such constraint: Developer ID signing takes a
# certificate in a secret, and notarisation is a network call. Until those
# secrets exist the job still runs, so the build itself is exercised, but
# its unsigned output is kept as a workflow artifact and never attached to
# the release. See the job for the rule.
#
# The extractor's source lives in silentsilo/core. It is built here from a
# clean clone of the core tag this app pins, checked against the commit the
# lockfile records, so the binary on the release page comes from exactly the
# revision the installer was compiled against. Same logic as the local script
# uses for the Windows one.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The extraction tool is the answer to "what if the project disappears", so
  # shipping it only inside the Windows installer would put it exactly where
  # it is least useful: someone recovering on Linux would have to install a
  # Windows application first. It is a plain binary with no interface and no
  # security key, so one source builds everywhere.
  build-extract:
    strategy:
      # One platform failing must not withhold the binary that did build: the
      # release is a draft either way, and a missing macOS binary is something
      # to notice rather than a reason to have no Linux one.
      fail-fast: false
      # Whichever job runs first creates the draft this uploads into. In
      # parallel they would race to create the same release, so they queue.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            asset: silentsilo-extract-linux-x86_64
            built: silentsilo-extract
          - os: macos-latest
            asset: silentsilo-extract-macos-aarch64
            built: silentsilo-extract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The pin is the single source of truth for which core revision the app
      # was compiled against. Read from the manifest and the lockfile rather
      # than typed here, and the two must agree with each other and with what
      # the clone below actually checks out.
      - name: Which core revision this build is pinned to
        id: pin
        shell: bash
        run: |
          tag=$(grep -m1 -oE 'silentsilo-core = \{ git = "[^"]+", tag = "([^"]+)"' Cargo.toml \
                | grep -oE 'tag = "[^"]+"' | cut -d'"' -f2)
          commit=$(awk '/^name = "silentsilo-core"$/{f=1} f && /^source = /{print; exit}' Cargo.lock \
                   | grep -oE '#[0-9a-f]{40}' | tr -d '#')
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Cargo.toml pins no core tag, or Cargo.lock records no commit for it"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "core $tag at $commit"

      # A tag can be moved after the fact; the lockfile's commit cannot. If
      # the two disagree, the extractor about to be built is not the code the
      # installer contains.
      - name: Clone core at that tag and check the commit
        shell: bash
        run: |
          git clone --quiet --branch "${{ steps.pin.outputs.tag }}" --depth 1 \
            https://github.com/silentsilo/core core-src
          got=$(git -C core-src rev-parse HEAD)
          if [ "$got" != "${{ steps.pin.outputs.commit }}" ]; then
            echo "::error::core ${{ steps.pin.outputs.tag }} is at $got, but Cargo.lock pins ${{ steps.pin.outputs.commit }}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: extract-${{ matrix.os }}
          workspaces: core-src

      # The keychain crate reaches for D-Bus on Linux, because the vault
      # stores credentials in the OS keychain and the persistent Linux
      # backend is secret-service. The extractor never calls that code, but
      # it links the crate, so the build needs the headers.
      #
      # This is a workaround rather than the answer. A recovery binary that
      # links libdbus needs libdbus present on the machine someone is
      # recovering on, which is the one place to assume nothing. Making the
      # keychain optional in silentsilo-vault is the real fix.
      - name: D-Bus headers, for the keychain crate the extractor does not use
        if: matrix.os == 'ubuntu-latest'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && break
            echo "apt-get update stalled or failed (attempt $attempt)"
            sudo pkill -9 -f apt-get || true
            sudo dpkg --configure -a || true
            sleep 5
          done
          sudo apt-get install -y libdbus-1-dev pkg-config

      # `-p` and nothing else: this must not drag in the security key backend,
      # which is the whole reason it builds on three platforms from one
      # source. `--locked` against core's own lockfile: the extractor ships
      # with the dependency versions core tested, not whatever resolves today.
      - run: cargo test -p silentsilo-extract --release --locked
        working-directory: core-src
      - run: cargo build -p silentsilo-extract --release --locked
        working-directory: core-src

      - name: Name the binary for the platform it runs on
        shell: bash
        run: |
          mkdir -p dist
          cp "core-src/target/release/${{ matrix.built }}" "dist/${{ matrix.asset }}"

      # Signed with the same updater key as the installer. This is the tool
      # someone downloads when they have lost confidence in everything else,
      # so "is this the binary the project published" has to be answerable
      # without trusting GitHub. Verify with minisign against the public key
      # in tauri.conf.json, also published as SIGNING-PUBKEY.txt in core.
      - name: Sign it
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli signer sign "dist/${{ matrix.asset }}"

      - name: Attach it to the draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: "Built against silentsilo/core ${{ steps.pin.outputs.tag }} (${{ steps.pin.outputs.commit }})."
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sig

  # The macOS application: a universal binary (Apple silicon and Intel) in a
  # .app inside a .dmg, plus the .app.tar.gz and its signature the updater
  # downloads. Built against the core commit the lockfile pins, like
  # everything else, through `--locked`.
  #
  # Signing and notarisation happen inside `tauri build` when the APPLE_*
  # variables are set, and are skipped when they are not. The rule that
  # decides whether the output reaches the release is the identity: without
  # one, the app is unsigned, Gatekeeper refuses it on every Mac, and an
  # updater manifest pointing at it would offer an update nobody can
  # install. So an unsigned build is uploaded as a workflow artifact, for
  # looking at, and only a signed one is attached to the draft.
  #
  # The macOS entries of latest.json are still assembled on the release
  # machine, from the .sig this job attaches; the manifest is one file
  # covering every platform and is published last, after the release is
  # live.
  build-macos-app:
    # After the extractors, so the draft exists before this attaches to it:
    # two jobs creating the same release at once would race.
    needs: build-extract
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
      - run: npm ci

      # Secrets are not readable in `if:`, so the decision is made once here
      # and read as a step output below.
      - name: Is there a signing identity
        id: apple
        shell: bash
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$IDENTITY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID present: the build will be signed and notarised"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID: the build will be unsigned and kept as an artifact only"
          fi

      # Two build steps rather than one with empty variables: the bundler
      # treats a set-but-empty APPLE_CERTIFICATE as a certificate to import,
      # and fails on it.
      - name: Build, unsigned
        if: steps.apple.outputs.signed == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --target universal-apple-darwin -- --locked

      - name: Build, sign and notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --ci --target universal-apple-darwin -- --locked

      - name: Collect the bundle
        shell: bash
        run: |
          out=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist
          cp "$out"/dmg/*.dmg dist/
          cp "$out"/macos/*.app.tar.gz "$out"/macos/*.app.tar.gz.sig dist/
          ls -l dist

      - name: Keep the unsigned build as an artifact
        if: steps.apple.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-unsigned
          path: dist/
          retention-days: 7

      - name: Attach the signed build to the draft
        if: steps.apple.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
