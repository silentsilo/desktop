name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# One run per branch: a newer push supersedes the runs before it, so a hung
# job cannot hold a queue of stale commits behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      # `--locked` on every cargo command below. The domain crates come from
      # silentsilo/core by git, and a lockfile left rewritten by a local
      # `[patch]` would otherwise build the app against a sibling directory
      # that does not exist here. This is the cheap half of that guard; the
      # `lockfile-guard` job is the half that says what actually happened.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - run: cargo check --all --locked

  # The core crates must come from silentsilo/core, by git, at the pinned tag.
  # Working on both repositories at once means a `[patch]` in
  # .cargo/config.toml, which rewrites Cargo.lock and strips the `source` line
  # from every crate it redirects. Committed, that lockfile points the release
  # build at whatever sits in a sibling directory on the machine that runs it.
  lockfile-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/check-lockfile.mjs

  # Evidence that the app still compiles off Windows. Not packaging, and not
  # a promise of a Linux or macOS build.
  #
  # The job that builds this tree runs on Windows, so Windows-only code can
  # spread into the app and nothing will say so. The day the macOS port
  # starts, that drift is the whole difference between implementation and
  # refactor. A few minutes here keeps the option open indefinitely, at no
  # commitment to shipping anything.
  #
  # Both platforms now, on every push: this repository is public, so the
  # macOS runner costs nothing and there is no reason to run it any less
  # often than the Linux half. The domain crates are checked in
  # silentsilo/core, on three platforms, and are not rechecked here.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: portability-${{ matrix.os }}
      # Tauri's webview and tray, the keychain's D-Bus backend, and the HID
      # layer the security key speaks over.
      - name: System libraries the workspace links against
        if: matrix.os == 'ubuntu-latest'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && break
            echo "apt-get update stalled or failed (attempt $attempt)"
            sleep 5
          done
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            libudev-dev \
            libssl-dev \
            pkg-config
      - run: npm ci
      # `tauri::generate_context!` refuses to compile when `frontendDist` is
      # missing, so the app crate cannot be checked without this.
      - run: npm run build
      - run: cargo check --all --locked

  # The UI flows, in a real browser against the mock backend. What the unit
  # tests cannot see is the wiring between screens: a button that stopped
  # doing anything is invisible to every test under src/. The visual
  # baselines do not run here: they are rendered by one platform's font
  # stack, and the committed ones are Windows-made. Flows only.
  ui-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `--with-deps` runs its own apt-get, so the -o flags the other Linux
      # jobs pass cannot reach it. The same settings go in apt.conf.d, where
      # every apt-get in this job picks them up, playwright's included. A
      # stalled mirror otherwise hangs for the whole timeout, and the
      # apt-get orphaned by that timeout keeps the lists lock, which is how
      # one stall turned into three failed attempts.
      - name: Cap apt when a mirror stalls
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - name: Browser for the flow tests
        run: |
          for attempt in 1 2 3; do
            timeout -k 30 300 npx playwright install --with-deps chromium && exit 0
            echo "playwright install stalled or failed (attempt $attempt)"
            # A killed attempt can leave apt-get holding the lock and dpkg
            # half-configured, which fails the retry before it starts.
            sudo pkill -9 -f apt-get || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1
      - run: npx playwright test
