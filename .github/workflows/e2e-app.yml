name: End-to-end

# The real app, driven over WebDriver: `npm run test:app`. Every night and on
# demand, never on push: the e2e build compiles the whole backend again.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: e2e
          # Saved on a failure too, or every failing night rebuilds from nothing.
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: cargo build -p silentsilo --features e2e --locked
        env:
          CARGO_TARGET_DIR: target/e2e
      - run: cargo install tauri-driver --version 2.0.6 --locked
      # The driver has to match the WebView2 the runner has.
      - name: msedgedriver
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "WebView2 $version"
          # A wrapper, so the driver writes its own log for a failure to be read.
          $driver = "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe"
          $log = "$env:RUNNER_TEMP\e2e-runs\msedgedriver.log"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\e2e-runs" | Out-Null
          "@echo off`r`n`"$driver`" --verbose `"--log-path=$log`" %*" | Out-File -Encoding ascii "$env:RUNNER_TEMP\edgedriver\msedgedriver-logged.cmd"
          "MSEDGEDRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver-logged.cmd" | Out-File -Append $env:GITHUB_ENV
      # The app alone for 30 seconds: whether it starts, stays up, and what it
      # says. Without a driver, so a failure below can be told apart.
      - name: The app starts on its own
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\e2e-runs\alone"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:SILENTSILO_E2E_DIR = $dir
          "session $((Get-Process -Id $PID).SessionId), interactive $([Environment]::UserInteractive), user $env:USERNAME"
          $app = Start-Process target/e2e/debug/silentsilo.exe -PassThru `
            -RedirectStandardOutput "$dir\stdout.txt" -RedirectStandardError "$dir\stderr.txt"
          Start-Sleep -Seconds 30
          if ($app.HasExited) { "exited with $($app.ExitCode)" } else { "still running"; Stop-Process -Id $app.Id -Force }
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          Get-Content "$dir\stdout.txt", "$dir\stderr.txt" -Tail 60 -ErrorAction SilentlyContinue
      - run: npm run test:app
        env:
          SILENTSILO_E2E_RUNS: ${{ runner.temp }}/e2e-runs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-app
          path: ${{ runner.temp }}/e2e-runs
